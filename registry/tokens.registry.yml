# INTENTUM™ DNA-OS · TOKENS REGISTRY
# Source of truth for ALL design tokens — colors · typography · spacing · shadow · motion
# Style Dictionary 4.0 ingests this and produces: CSS · Tailwind v3 · Tailwind v4 · DTCG · SCSS
#
# Authoritative for: tokens, OKLCH neutrals, Trinity Typography, Liquid Champagne, Top 5 Steals (codified)
# Approved by: Matheus Allvarenga (2026-05-07)

$schema: ./schemas/tokens-registry.schema.yml
version: 1.2.0

# ═══════════════════════════════════════════════════════════
# COLOR — Dual-tier gold + OKLCH neutrals + Studios + Semantic INTENTUM
# ═══════════════════════════════════════════════════════════

color:
  # ── BRAND GOLD — DUAL TIER ──
  brand:
    gold-deep:
      $value: '#AE813D'
      $type: color
      $description: 'CANONICAL — Brand Manual V2 + canonical SVGs · ceremonial · Cinzel · focus rings · founding texts · achievement markers · print'
      $extensions:
        com.intentum.color-spaces:
          hsl: '35 47% 46%'
        com.intentum.provenance: high # confirmed in Manual V2 + SVG sources
    gold-champagne:
      $value: '#C9B298'
      $type: color
      $description: 'UI WORKHORSE — regular Studio accent · body italic emphasis · Hover-Reveal CTA target · badges · default icon fills · Liquid Gold/Champagne overlays'
      $extensions:
        com.intentum.color-spaces:
          hsl: '32 27% 69%'
        com.intentum.provenance: high
    gold-bright:
      $value: '#E4D8CA'
      $type: color
      $description: 'Lightest tone — gradient top · subtle highlights'
      $extensions:
        com.intentum.provenance: high
    gold-soft:
      $value: '#8D7556'
      $type: color
      $description: 'Pressed states · gradient bottom · Cinzel on light backgrounds'
      $extensions:
        com.intentum.provenance: high
    gold:
      $value: '{color.brand.gold-champagne}'
      $type: color
      $description: 'Default alias — UI workhorse'

  # ── SURFACE LADDER (OKLCH-symmetric · ready for light-mode inversion) ──
  # NOTE: $value is hex (DTCG primitive). OKLCH + HSL representations live in
  # $extensions.com.intentum.color-spaces — Style Dictionary custom transformer
  # (HSL→OKLCH · Sprint 3) reads from extensions to emit perceptually uniform output.
  surface:
    base:
      $value: '#070709'
      $type: color
      $description: 'Body background — dominant 90%+ surface'
      $extensions:
        com.intentum.color-spaces:
          oklch: 'oklch(0.18 0 0)' # near-black perceptually uniform
          hsl: '240 5% 4%' # legacy HSL representation
        com.intentum.provenance: high
    elevate:
      $value: '#141417'
      $type: color
      $description: 'Cards · elevated panels'
      $extensions:
        com.intentum.color-spaces:
          oklch: 'oklch(0.21 0.005 285)'
          hsl: '240 4% 8%'
        com.intentum.provenance: high
    elevate-2:
      $value: '#1F1F22'
      $type: color
      $description: 'Modal · popover · dropdown'
      $extensions:
        com.intentum.color-spaces:
          oklch: 'oklch(0.25 0.005 285)'
          hsl: '240 4% 12%'
    border:
      $value: '#292929'
      $type: color
      $description: 'Hairlines · dividers'
      $extensions:
        com.intentum.color-spaces:
          oklch: 'oklch(0.30 0 0)'
          hsl: '0 0% 16%'
    warm-deep:
      $value: '#14110A'
      $type: color
      $description: 'Gradient stop 2 — founder card variant dark terminus · deep warm black (DA-002 · 2026-05-29)'
      $extensions:
        com.intentum.color-spaces:
          oklch: 'oklch(0.09 0.012 60)'
          hsl: '40 22% 6%'
        com.intentum.use: gradient-stop
        com.intentum.provenance: high # extracted from card.tsx founder variant
    print:
      $value: '#1C282F'
      $type: color
      $description: 'Print-only dark teal-navy per Brand Manual V2'
      $extensions:
        com.intentum.use: print-only

  # ── TEXT (alpha-cream hierarchy · v1.1.1 legibility-corrected) ──
  text:
    primary:
      $value: '#FAFAFA'
      $type: color
      $description: 'Body text · 100% alpha'
      $extensions:
        com.intentum.color-spaces:
          oklch: 'oklch(0.98 0 0 / 1.0)'
          hsl: '0 0% 98%'
    mid:
      $value: 'rgba(250, 250, 250, 0.82)'
      $type: color
      $description: 'Secondary text · 82% alpha (corrected from 0.68 — too dim)'
    dim:
      $value: 'rgba(250, 250, 250, 0.58)'
      $type: color
      $description: 'Muted text · 58% alpha (corrected from 0.42)'
    faint:
      $value: 'rgba(250, 250, 250, 0.32)'
      $type: color
      $description: 'Disabled · 32% alpha (corrected from 0.22)'
    ceremonial:
      $value: '{color.brand.gold-deep}'
      $type: color
      $description: 'Cinzel display · founding texts · achievement markers'
    accent:
      $value: '{color.brand.gold-champagne}'
      $type: color
      $description: 'Regular gold inline emphasis · body italics'

  # ── STATUS SEMANTICS (walled off · only for state) ──
  # NOTE: $value uses hex (DTCG primitive). HSL alternates live in $extensions.
  status:
    success:
      $value: '#22C55E'
      $type: color
      $extensions:
        com.intentum.color-spaces:
          hsl: 'hsl(142 76% 51%)'
    warning:
      $value: '#F59E0B'
      $type: color
      $extensions:
        com.intentum.color-spaces:
          hsl: 'hsl(37 100% 52%)'
    error:
      $value: '#EF4444'
      $type: color
      $extensions:
        com.intentum.color-spaces:
          hsl: 'hsl(4 100% 62%)'
    info:
      $value: '#3B82F6'
      $type: color
      $extensions:
        com.intentum.color-spaces:
          hsl: 'hsl(211 100% 52%)'

  # ── STUDIOS (mono-accent · all share gold · differentiate by surface depth) ──
  studio:
    design-system:
      primary: '{color.brand.gold-champagne}'
      ceremonial: '{color.brand.gold-deep}'
      surface_default: '{color.surface.base}'
    profile:
      primary: '{color.brand.gold-champagne}'
      ceremonial: '{color.brand.gold-deep}'
      surface_default: '{color.surface.base}'
      $description: 'Daily ritual surfaces · ceremonial dominante'
    pkm:
      primary: '{color.brand.gold-champagne}'
      ceremonial: '{color.brand.gold-deep}'
      surface_default: '{color.surface.base}'
    business:
      primary: '{color.brand.gold-champagne}'
      ceremonial: '{color.brand.gold-deep}'
      surface_default: '{color.surface.elevate-2}'
      $description: 'Operacional · data-dense · deeper surface'
    marketing:
      primary: '{color.brand.gold-champagne}'
      ceremonial: '{color.brand.gold-deep}'
      surface_default: '{color.surface.elevate}'
      $description: 'Cinzel hero · Profético register dominante'
    content:
      primary: '{color.brand.gold-champagne}'
      ceremonial: '{color.brand.gold-deep}'
      surface_default: '{color.surface.elevate}'
      $description: 'Existencial register · long-form measure'
    events:
      primary: '{color.brand.gold-champagne}'
      ceremonial: '{color.brand.gold-deep}'
      surface_default: '{color.surface.elevate-2}'
      $description: 'Ceremonial gold dominante · ritual surfaces'
    media:
      primary: '{color.brand.gold-champagne}'
      ceremonial: '{color.brand.gold-deep}'
      surface_default: '{color.surface.base}'

  # ── SEMANTIC INTENTUM (Adriano prescription · brand DNA codificado) ──
  semantic:
    clareza:
      $value: '{color.surface.base}'
      $description: 'Pilar 1 — surface base · vazio = clareza · primeiro pilar do Método ITM'
    conhecimento:
      $value: '{color.surface.elevate}'
      $description: 'Pilar 2 — camada acima da clareza · Conhecimento estruturado'
    atitude:
      $value: '{color.brand.gold-deep}'
      $description: 'Pilar 3 — gold-deep · ação ceremonial · onde a verdade vira comando'
    corpo:
      $value: '{color.text.primary}'
      $description: 'Tripartição — corpo · matéria densa · 100% alpha'
    alma:
      $value: '{color.text.mid}'
      $description: 'Tripartição — alma · camada intermediária'
    espirito:
      $value: '{color.brand.gold-deep}'
      $description: 'Tripartição — espírito · centelha cerimonial'
    fragmentacao:
      $value: '{color.status.error}'
      $description: 'Inimigo raiz — alert vermelho'
    modo-sobrevivencia:
      $value: '{color.text.dim}'
      $description: 'Sintoma público — cinza dim'
    soberania:
      $value: '{color.brand.gold-deep}'
      $description: 'Outcome promise — gold-deep cerimonial'

# ═══════════════════════════════════════════════════════════
# TYPOGRAPHY — Trinity Contract (Bugatti steal · enforced)
# ═══════════════════════════════════════════════════════════

typography:
  trinity:
    $description: 'Hard role boundaries enforced by mind_ux_designer · NO mixing'

    display_ceremonial:
      family: Cinzel
      role: 'Logo wordmark · ceremonial founding texts · print'
      weights: [400, 500, 600, 700]
      license: SIL OFL (Google Fonts)
      authoritative_source: Brand Manual V2

    display_digital:
      family: 'Instrument Serif'
      fallback: ['Source Serif 4', 'Georgia', 'serif']
      role: 'h1, h2 ONLY · italic-emphasis · NEVER bold'
      weights: [400]
      style: italic
      license: SIL OFL
      $note: 'Temporary digital alternative until Cinzel digital optimization. Long-term goal: harmonize with Cinzel ceremonial.'

    body_operational:
      family: Montserrat
      fallback: ['Inter Tight', 'Source Sans Pro', 'system-ui', 'sans-serif']
      role: 'Everything operational — body · UI · buttons · navigation'
      weights: [300, 400, 500, 600, 700]
      license: SIL OFL
      authoritative_source: Brand Manual V2

    metadata_data:
      family: 'JetBrains Mono'
      fallback: ['Fira Code', 'monospace']
      role: 'Numerics · 10-12px metadata at 0.05em tracking · code'
      weights: [400, 500, 600]
      license: SIL OFL

    display_hero_cinematic:
      family: Rajdhani
      fallback: [Cinzel, sans-serif]
      role: 'Cinematic 84px+ marketing hero ONLY'
      weights: [500, 600, 700]
      license: SIL OFL
      $note: 'Lamborghini steal · sparingly used'

  enforcement:
    rule: 'Trinity Typography Contract — hard role boundaries'
    enforced_by: mind_ux_designer (rubric · token_validation)
    violations:
      - 'Cinzel for body copy (illegible)'
      - 'Instrument Serif at body sizes (visual noise)'
      - 'Inter for numerics (use mono — data deserves data type)'
      - 'Mixing display faces in single component'
      - 'Bold (700) in Instrument Serif (italic is the only emphasis mechanism)'

  # ── Scale — Minor Third 1.2x (base 16px) ──
  scale:
    ratio:
      $value: 1.2
      $type: number
      $description: 'Minor Third musical ratio · perceptually balanced typography scale'
    base:
      $value: 16
      $type: number
      $description: 'Base font size in px · scale derives from this'
    sizes:
      '2xs':
        $value: '0.579rem'
        $type: dimension
        $description: '~9px'
      xs:
        $value: '0.694rem'
        $type: dimension
        $description: '~11px'
      sm:
        $value: '0.833rem'
        $type: dimension
        $description: '~13px'
      base:
        $value: '1rem'
        $type: dimension
        $description: '16px'
      lg:
        $value: '1.2rem'
        $type: dimension
        $description: '~19px'
      xl:
        $value: '1.44rem'
        $type: dimension
        $description: '~23px'
      '2xl':
        $value: '1.728rem'
        $type: dimension
        $description: '~28px'
      '3xl':
        $value: '2.074rem'
        $type: dimension
        $description: '~33px'
      '4xl':
        $value: '2.488rem'
        $type: dimension
        $description: '~40px'
      '5xl':
        $value: '2.986rem'
        $type: dimension
        $description: '~48px'
      cinematic:
        $value: '5.25rem'
        $type: dimension
        $description: '~84px (Lamborghini · marketing hero only)'

  weight:
    light:
      $value: 300
      $type: fontWeight
    normal:
      $value: 400
      $type: fontWeight
    medium:
      $value: 500
      $type: fontWeight
    semibold:
      $value: 600
      $type: fontWeight
    bold:
      $value: 700
      $type: fontWeight

  line-height:
    none:
      $value: 1.0
      $type: number
    tight:
      $value: 1.25
      $type: number
    snug:
      $value: 1.375
      $type: number
    normal:
      $value: 1.5
      $type: number
    relaxed:
      $value: 1.625
      $type: number
    loose:
      $value: 1.75
      $type: number

  letter-spacing:
    tight:
      $value: '-0.04em'
      $type: dimension
      $description: 'display ≥48px (Krea-style)'
    normal:
      $value: '0.012em'
      $type: dimension
      $description: 'body (research-backed reading)'
    metadata:
      $value: '0.05em'
      $type: dimension
      $description: 'mono captions · uppercase'
    wordmark:
      $value: '0.06em'
      $type: dimension
      $description: 'Cinzel wordmark'

  measure: # editorial line-length tokens (in ch)
    narrow:
      $value: '45ch'
      $type: dimension
    base:
      $value: '65ch'
      $type: dimension
      $description: 'editorial sweet spot (Medium/NYT/Guardian)'
    wide:
      $value: '75ch'
      $type: dimension
    max:
      $value: '80ch'
      $type: dimension

