# ═══════════════════════════════════════════════════════════
# SHADOW — Depth Trinity (Liquid Gold + Liquid Champagne + Zero-Shadow)
# ═══════════════════════════════════════════════════════════

shadow:
  none:
    $value: 'none'
    $type: shadow
  sm:
    $value: '0 1px 2px rgba(0,0,0,0.2)'
    $type: shadow
  md:
    $value: '0 4px 6px rgba(0,0,0,0.3)'
    $type: shadow

  glow_gold:
    $value: '0 0 15px rgba(174, 129, 61, 0.3)'
    $description: 'gold-deep glow · Glowing button default'
  glow_gold_hover:
    $value: '0 0 25px rgba(174, 129, 61, 0.5)'
    $description: 'gold-deep glow · Glowing button hover'
  glow_champagne:
    $value: '0 0 15px rgba(201, 178, 152, 0.3)'

  lg_gold:
    $value: '0 10px 40px rgba(201, 178, 152, 0.25)'
    $description: 'Gold-tinted drop shadow · Academia Lendária pattern'

  liquid_champagne:
    $value: |
      0 0 2px .5px rgba(0,0,0,0.2),
      0 0 4px 1px rgba(0,0,0,0.1),
      0 0 8px 2px rgba(0,0,0,0.05),
      0 0 0 .5px #000,
      inset 0 0 0 1px rgba(201,178,152,0.08),
      inset 0 0 3px 1px rgba(201,178,152,0.10),
      inset 0 .5px 0 .5px rgba(201,178,152,0.10)
    $type: shadow
    $description: 'TOP STEAL #2 · Krea 7-shadow recipe re-tinted in champagne · cards & elevated surfaces · render-engine UI feel'
    $extensions:
      com.intentum.source: krea (7-shadow inner-glow)
      com.intentum.gate: '@media (prefers-reduced-transparency: no-preference)'

# ═══════════════════════════════════════════════════════════
# MOTION
# ═══════════════════════════════════════════════════════════

motion:
  ease:
    default:
      $value: 'cubic-bezier(0.4, 0, 0.2, 1)'
      $type: cubicBezier
    emphasis:
      $value: 'cubic-bezier(0.16, 1, 0.3, 1)'
      $type: cubicBezier
    linear:
      $value: 'linear'
      $type: cubicBezier
      $description: 'Standard linear easing'

  duration:
    micro:
      $value: '150ms'
      $type: duration
    short:
      $value: '200ms'
      $type: duration
    medium:
      $value: '300ms'
      $type: duration
    long:
      $value: '500ms'
      $type: duration

  # Council amendment #2 (Sprint 3 Day 1) · keyframes split duration + iteration
  # for parser determinism. Composer consumers reference both tokens.
  keyframe:
    shimmer:
      duration:
        $value: '1500ms'
        $type: duration
        $description: 'Liquid Gold button shimmer · duration'
      iteration:
        $value: 'infinite'
        $description: 'CSS animation-iteration-count · non-canonical DTCG type'
        $extensions:
          com.intentum.css_property: animation-iteration-count
    float:
      duration:
        $value: '3s'
        $type: duration
      iteration:
        $value: 'infinite'
        $extensions:
          com.intentum.css_property: animation-iteration-count
      timing:
        $value: 'ease-in-out'
        $extensions:
          com.intentum.css_property: animation-timing-function
    pulse_slow:
      duration:
        $value: '3s'
        $type: duration
      iteration:
        $value: 'infinite'
        $extensions:
          com.intentum.css_property: animation-iteration-count
      timing:
        $value: 'ease-in-out'
        $extensions:
          com.intentum.css_property: animation-timing-function

# ═══════════════════════════════════════════════════════════
# GRADIENTS (cinematic — recovered for harmony · v3)
# ═══════════════════════════════════════════════════════════

gradient:
  # Per Q2 (Sprint 3 Day 1) · gradients use $value as bare CSS string + $extensions for structured semantics
  # Future-proof for DTCG community ratification of gradient as canonical type
  hero:
    $value: 'linear-gradient(170deg, #070709 0%, #1A150F 55%, #3A2F22 100%)'
    $type: string
    $description: 'Cinematic dark hero · gold-tinted bottom'
    $extensions:
      com.intentum.gradient:
        type: linear
        angle: '170deg'
        stops:
          - { color: '#070709', pos: '0%' }
          - { color: '#1A150F', pos: '55%' }
          - { color: '#3A2F22', pos: '100%' }
  card:
    $value: 'linear-gradient(180deg, #070709 0%, #14110A 100%)'
    $type: string
    $description: 'Subtle card surface gradient'
    $extensions:
      com.intentum.gradient:
        type: linear
        angle: '180deg'
        stops:
          - { color: '#070709', pos: '0%' }
          - { color: '#14110A', pos: '100%' }
  section:
    $value: 'linear-gradient(170deg, #070709 0%, #1A150F 55%, #2D2418 100%)'
    $type: string
    $description: 'Section background · subtle gold descent'
    $extensions:
      com.intentum.gradient:
        type: linear
        angle: '170deg'
        stops:
          - { color: '#070709', pos: '0%' }
          - { color: '#1A150F', pos: '55%' }
          - { color: '#2D2418', pos: '100%' }
  gold:
    $value: 'linear-gradient(135deg, #E4D8CA 0%, #C9B298 50%, #8D7556 100%)'
    $type: string
    $description: 'Brand gold gradient · light-to-dark champagne'
    $extensions:
      com.intentum.gradient:
        type: linear
        angle: '135deg'
        stops:
          - { color: '#E4D8CA', pos: '0%' }
          - { color: '#C9B298', pos: '50%' }
          - { color: '#8D7556', pos: '100%' }
  gold_shimmer:
    $value: 'linear-gradient(45deg, rgba(255,255,255,0) 40%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0) 60%)'
    $type: string
    $description: 'Shimmer overlay · used with motion.keyframe.shimmer for Liquid Gold button effect'
    $extensions:
      com.intentum.gradient:
        type: linear
        angle: '45deg'
        purpose: shimmer_overlay
        stops:
          - { color: 'rgba(255,255,255,0)', pos: '40%' }
          - { color: 'rgba(255,255,255,0.2)', pos: '50%' }
          - { color: 'rgba(255,255,255,0)', pos: '60%' }

# ═══════════════════════════════════════════════════════════
# REGRA DOS 8% (enforced by lint)
# ═══════════════════════════════════════════════════════════

rules:
  regra_dos_8_percent:
    rule: 'Cor não-neutra (gold + status) ocupa ≤8% da área de qualquer screen single-screen'
    enforcement: ralph-coverage-audit + design-md drift detection
    rationale: 'Gold escassez = brand reveal. Cada aparição da cor é um momento de marca, não decoração.'
    source: BVS doctrine + Krea/Lendário pattern observation

