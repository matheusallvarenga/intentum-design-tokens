# ═══════════════════════════════════════════════════════════
# STEAL BATCH 2 — codificado 2026-05-16 · Krea + Huly + Lamborghini
# Validado em brand-guide.html + intentum-traffic-flows.html produção
# patterns.registry.yml v1.2.0 é a fonte de choreography recipes
# ═══════════════════════════════════════════════════════════

steal_batch_2_codified:
  conic_shimmer_marker:
    source: krea (rotating sheen adapt)
    validated: brand-guide.html section markers · intentum-traffic-flows.html [N] labels
    css_property: '@property --marker-angle · background: conic-gradient(from var(--marker-angle))'
    animation: 'marker-shimmer 6s linear infinite'
    tokens_used:
      - color.brand.gold-deep # #AE813D stop em 280deg
      - color.brand.gold-champagne # #C9B298 stop em 60deg/200deg
      - color.brand.gold-bright # #E4D8CA stop em 130deg
      - color.brand.gold-soft # #8D7556 stop em 0deg/360deg
    implementation: |
      @property --marker-angle { syntax:'<angle>'; initial-value:0deg; inherits:false; }
      .section-marker {
        background: conic-gradient(from var(--marker-angle) at 50% 50%,
          #8d7556 0deg, #c9b298 60deg, #e4d8ca 130deg, #c9b298 200deg, #ae813d 280deg, #8d7556 360deg);
        -webkit-background-clip: text; animation: marker-shimmer 6s linear infinite;
      }
      @keyframes marker-shimmer { to { --marker-angle: 360deg; } }
    gate: '@supports (background: conic-gradient(from 1deg, red, blue)) · fallback linear-gradient'
    a11y: '@media (prefers-reduced-motion: reduce) { animation: none !important }'

  krea_card_outline:
    source: krea (glass button technique adapted to cards)
    validated: brand-guide.html .sdm-card · .diagram-card
    css_property: 'outline: 0.5px solid rgba(201,178,152,0.07); outline-offset: -1px'
    tokens_used:
      - color.brand.gold-champagne # rgba(201,178,152,0.07) — 7% opacity
    rationale: |
      outline does NOT affect box model · zero layout risk
      Creates glass-panel inner edge — invisible at distance but present on close inspection
      Distinct from border: visible even when element has overflow:hidden

  huly_gradient_glow_cta:
    source: huly (border-image technique adapted for border-radius compatibility)
    validated: brand-guide.html .button.primary / button.tsx variants
    css_property: '::before box-shadow glow halo · opacity: 0 → 1 on :hover'
    tokens_used:
      - color.brand.gold-deep # #AE813D · outer glow 0 0 24px 4px rgba(174,129,61,0.45)
      - color.brand.gold-champagne # #C9B298 · inner glow 0 0 10px 2px rgba(201,178,152,0.65)
    implementation: |
      .btn-primary { position: relative; z-index: 1; overflow: visible; }
      .btn-primary::before {
        content: ''; position: absolute; inset: -3px; border-radius: inherit;
        box-shadow: 0 0 24px 4px rgba(174,129,61,0.45), 0 0 10px 2px rgba(201,178,152,0.65);
        opacity: 0; transition: 300ms cubic-bezier(0.16,1,0.3,1); z-index: -1;
      }
      .btn-primary:hover::before { opacity: 1; }
    note: 'border-image incompatible with border-radius — pseudo-element approach required'

  huly_marquee_infinityscroll:
    source: huly (infinityScroll horizontal content stream)
    validated: brand-guide.html [05] Anchor Phrases · intentum-traffic-flows.html tasks
    css_property: 'animation: marquee-infinite 50s linear infinite'
    tokens_used:
      - motion.duration.long # 500ms — each item entrance when new
      - motion.ease.emphasis # cubic-bezier(0.16,1,0.3,1) — spring feel on hover pause
      - color.brand.gold-champagne # rgba(201,178,152,0.14) pill border resting
    implementation: |
      .marquee-track { display: flex; width: max-content; animation: marquee-infinite 50s linear infinite; }
      @keyframes marquee-infinite { from { transform: translateX(0); } to { transform: translateX(-50%); } }
      .marquee-wrap { mask-image: linear-gradient(to right, transparent 0%, black 7%, black 93%, transparent 100%); }
    content_rule: 'Content duplicated — animation moves exactly -50% so loop is seamless'
    pause_on_hover: 'animation-play-state: paused on :hover'
    gate: '@media (prefers-reduced-motion: reduce) { animation: none !important }'

  cursor_radial_reveal:
    source: huly (cursor-follow highlight layer)
    validated: brand-guide.html #guide-cursor-reveal
    css_property: 'mask-image: radial-gradient(350px circle at var(--cx, 50%) var(--cy, 50%), black 0%, transparent 100%)'
    js_implementation: |
      document.addEventListener('mousemove', (e) => {
        document.documentElement.style.setProperty('--cx', e.clientX + 'px');
        document.documentElement.style.setProperty('--cy', e.clientY + 'px');
      });
    tokens_used:
      - color.brand.gold-champagne # rgba(201,178,152,0.018) — subtle highlight layer
    layer_structure: 'Fixed div above noise · below layout · pointer-events:none'

  lamborghini_section_fade:
    source: lamborghini (cinema gradient photography-to-background)
    validated: brand-guide.html .hero::after · intentum-traffic-flows.html .sdm-section
    css_property: '::after { background: linear-gradient(to bottom, transparent 0%, var(--surface-base) 100%) }'
    tokens_used:
      - color.surface.base # #070709 — end color of fade
    implementation: |
      .section-hero { position: relative; }
      .section-hero::after {
        content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 80px;
        background: linear-gradient(to bottom, transparent 0%, #070709 100%);
        pointer-events: none; z-index: 1;
      }
    rationale: 'Borrowed from how Lamborghini fades car photography into page surface · depth without shadow'

